name: Deploy Our World

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Our World
        run: pnpm build

      - name: Configure Cloudflare deployment
        run: node scripts/configure-deploy.mjs
        env:
          CLOUDFLARE_D1_ID: ${{ secrets.CLOUDFLARE_D1_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}

      - name: Verify and repair account database
        run: |
          pnpm exec wrangler d1 execute our-world --remote --file=migrations/0001_accounts.sql --config dist/server/wrangler.json
          pnpm exec wrangler d1 execute our-world --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('accounts','sessions','auth_attempts');" --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Clear owner registration test limit
        if: github.event.head_commit.message == 'Fix registration reset and clear limit'
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";

          const email = process.env.OWNER_EMAIL?.trim().toLowerCase();
          if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            throw new Error("OWNER_EMAIL is missing or invalid");
          }

          const escaped = email.replaceAll("'", "''");
          const sql = "DELETE FROM auth_attempts WHERE key = 'register:" + escaped + "'";

          const result = spawnSync(
            "pnpm",
            [
              "exec", "wrangler", "d1", "execute", "our-world",
              "--remote",
              "--command", sql,
              "--config", "dist/server/wrangler.json"
            ],
            { stdio: "inherit" }
          );

          if (result.status !== 0) {
            process.exit(result.status || 1);
          }
          JS
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
